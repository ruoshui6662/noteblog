services:
  docs:
    image: ${DOCS_IMAGE:-ghcr.io/ruoshui6662/noteblog:edge}
    restart: unless-stopped
    # Keep the long-running HTTP server as PID 1; healthcheck is not the command.
    entrypoint: ["/usr/local/bin/markdown-docs"]
    command: []
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: 0.0.0.0:8080
      APP_DATA_DIR: /data
      APP_ENV: container
    volumes:
      - ${DOCS_DATA_DIR:-/vol1/1000/docker/noteblog}:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/markdown-docs", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
