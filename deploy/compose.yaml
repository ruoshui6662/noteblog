services:
  docs:
    image: ghcr.io/ruoshui6662/noteblog:edge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: 0.0.0.0:8080
      APP_DATA_DIR: /data
      APP_ENV: container
    volumes:
      - docs-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/markdown-docs", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  docs-data:
